<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Reservas | Explora Tulcán</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="Logo Explora Tulcán">
                <span>Explora Tulcán</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="destinos.html">Lugares Turísticos</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">Contacto y Reservas</h1>

        <div class="form-container">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Correo Electrónico *</label>
                        <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono *</label>
                        <input type="tel" id="telefono" name="telefono" required placeholder="0991234567">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="destino">Destino o Actividad Principal</label>
                        <select id="destino" name="destino" required>
                            <option value="">-- Selecciona una opción --</option>
                            <option value="cementerio">Cementerio de Tulcán</option>
                            <option value="volcan-chiles">Volcán Chiles y Páramo</option>
                            <option value="gruta-paz">Gruta de la Paz</option>
                            <option value="gastronomia">Ruta Gastronómica</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="servicio">Tipo de Servicio</label>
                        <select id="servicio" name="servicio" required>
                            <option value="">-- Selecciona un servicio --</option>
                            <option value="tour-diario">Tour Excursión de 1 Día</option>
                            <option value="paquete-completo">Paquete Fin de Semana</option>
                            <option value="transporte">Transporte Turístico Privado</option>
                            <option value="guia">Guía Especializado</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha">Fecha Estimada de Viaje *</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>
                    <div class="form-group">
                        <label for="personas">Número de Personas *</label>
                        <input type="number" id="personas" name="personas" min="1" max="50" required placeholder="1">
                    </div>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje / Requerimientos Especiales</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí tus dudas o peticiones adicionales..."></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Enviar Consulta / Pre-Reserva</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Explora Tulcán - Agencia de Turismo Ficticia. Proyecto Académico.</p>
    </footer>

</body>
</html>
